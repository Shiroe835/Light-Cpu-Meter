name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Build macOS app
        run: /bin/bash Scripts/build.sh

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent CPUMonitor.app CPUMonitor-macos.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUMonitor-macos
          path: CPUMonitor-macos.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "${RELEASE_TAG}" CPUMonitor-macos.zip --generate-notes
