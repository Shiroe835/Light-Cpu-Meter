name: Build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS app
        run: /bin/bash Scripts/build.sh

      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent CPUMonitor.app CPUMonitor-macos.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" CPUMonitor-macos.zip --generate-notes
